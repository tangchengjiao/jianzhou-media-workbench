name: build-macos-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version label
        required: true
        default: 2.1.0-context-20260808

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build app bundle
        run: bash packaging/build_macos.sh "${{ inputs.version }}"
      - name: Verify no plaintext credential patterns
        shell: bash
        run: |
          if grep -RIE --exclude='SHA256SUMS.txt' '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' output/releases; then
            echo 'Potential credential found in release output' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: jianzhou-macos-${{ runner.arch }}
          path: output/releases/见舟工作台-${{ inputs.version }}-macos-*/
          if-no-files-found: error
          retention-days: 14
